<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALFATECH Mobiles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ALFATECH MOBILES — luxurious black & gold storefront preview.
   Deep black surfaces, warm gold accents and cream typography. Product
   photographs sit on clean white tiles framed in gold, so the phones stay true
   while the chrome around them reads premium. */
:root{
  --ink:#F2ECDC; --bg:#0A0A0A; --bg2:#141210; --surface:#16130E;
  --obsidian:#000000; --charcoal:#1C1913;
  --gold:#D4AF52; --gold-light:#F1DA98; --gold-dark:#8A6A1F; --gold-soft:#1E1A12;
  --gold-grad:linear-gradient(135deg,#F1DA98 0%,#D4AF52 46%,#9C7A2A 100%);
  --red:#E0313D; --red-dark:#B51F29; --red-soft:#241315;
  --muted:#9C927C; --line:#2C271D; --line2:#3C3526; --ok:#62C692; --ok-soft:#10251A;
  --shadow:0 18px 50px -26px rgba(0,0,0,.85);
  --glow:0 0 0 1px rgba(212,175,82,.28), 0 20px 48px -26px rgba(0,0,0,.9);
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 520px at 50% -240px, rgba(212,175,82,.07), transparent 70%), var(--bg); color:var(--ink); font-family:var(--f); font-size:15.5px; line-height:1.55; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:90; background:var(--obsidian)}
h1,h2,h3,h4{margin:0; line-height:1.15; letter-spacing:-.015em; font-weight:800; text-wrap:balance; color:var(--ink)}
p{margin:0}
a{color:inherit}
img{max-width:100%; display:block}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:6px}
.wrap{max-width:1240px; margin-inline:auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.kicker{font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.kicker.gold{color:var(--gold)}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:46px; padding:0 20px; border-radius:10px; border:1.5px solid transparent; font-weight:800; font-size:15px; text-decoration:none; cursor:pointer; white-space:nowrap; transition:background .15s,border-color .15s,color .15s,filter .15s; letter-spacing:.01em}
.btn-red{background:var(--gold-grad); color:var(--obsidian); box-shadow:0 10px 26px -14px rgba(212,175,82,.5)}
.btn-red:hover{filter:brightness(1.07)}
.btn-dark{background:transparent; color:var(--gold); border-color:var(--gold-dark)}
.btn-dark:hover{border-color:var(--gold); color:var(--gold-light)}
.btn-gold{background:var(--gold-grad); color:var(--obsidian)}
.btn-gold:hover{filter:brightness(1.07)}
.btn-line{background:transparent; border-color:var(--line2); color:var(--ink)}
.btn-line:hover{border-color:var(--gold); color:var(--gold-light)}
.btn-wa{background:#1F8F4E; color:#fff}
.btn.sm{min-height:38px; padding:0 14px; font-size:14px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.link{font-weight:700; text-decoration:underline; text-underline-offset:3px; background:none; border:0; padding:0; cursor:pointer; color:var(--gold)}
.link:hover{color:var(--gold-light)}

/* preview strip */
.pv{background:var(--bg2); border-bottom:1px solid var(--line); font-size:12.5px; color:var(--muted)}
.pv b{color:var(--gold)}
.pv .wrap{padding-block:7px}

/* header */
.hdr{position:sticky; top:env(safe-area-inset-top,0px); z-index:70; background:rgba(8,7,5,.9); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); color:var(--ink); border-bottom:1px solid var(--line)}
.hdr-in{display:flex; align-items:center; gap:10px; min-height:62px}
/* gold ALFATECH wordmark, extreme left */
.wordmark{flex:none; display:inline-flex; flex-direction:column; justify-content:center; text-decoration:none; margin-right:6px}
.wordmark b{display:block; font-weight:800; font-size:clamp(19px,2.4vw,24px); letter-spacing:.1em; line-height:1; background:var(--gold-grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.wordmark span{display:block; font-size:9px; letter-spacing:.34em; color:var(--muted); margin-top:4px; font-weight:700}
/* icon cluster + supplied logo, extreme right */
.tools{display:flex; gap:1px; align-items:center; margin-left:auto}
.ib{position:relative; display:grid; place-items:center; width:42px; height:42px; border-radius:10px; border:0; background:transparent; color:var(--ink); cursor:pointer; text-decoration:none}
.ib:hover{background:var(--charcoal); color:var(--gold)}
.ib svg{width:21px; height:21px}
.badge{position:absolute; top:3px; right:2px; min-width:18px; height:18px; padding:0 5px; border-radius:99px; background:var(--red); color:#fff; font-size:10.5px; font-weight:800; display:grid; place-items:center}
.badge[data-n="0"]{display:none}
.hdr-logo{flex:none; margin-left:8px; display:block}
.hdr-logo img{width:46px; height:46px; border-radius:10px; box-shadow:0 0 0 1px var(--line2)}
/* brand navigation row */
.brandnav{border-top:1px solid var(--line); background:var(--obsidian)}
.brandnav .wrap{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.brandnav .wrap::-webkit-scrollbar{display:none}
.brandnav a{flex:none; padding:11px 14px; text-decoration:none; font-size:14px; font-weight:600; color:var(--muted); white-space:nowrap; border-bottom:2px solid transparent}
.brandnav a:hover{color:var(--ink)}
.brandnav a[aria-current="true"]{color:var(--gold); font-weight:800; border-bottom-color:var(--gold)}
@media (max-width:560px){ .wordmark span{display:none} .ib{width:38px; height:38px} .hdr-logo img{width:40px; height:40px} }

/* hero */
.hero{background:linear-gradient(180deg,#0D0B08 0%,#0A0A0A 100%); color:var(--ink); border-bottom:1px solid var(--line)}
.hero-in{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:30px; align-items:center; padding-block:40px}
.hero-logo{width:clamp(150px,27vw,210px); height:auto; margin-bottom:14px; filter:drop-shadow(0 10px 34px rgba(212,175,82,.18))}
.hero .eyebrow{font-size:12px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:var(--gold)}
.hero h1{font-size:clamp(30px,4.6vw,50px); line-height:1.04; letter-spacing:-.03em; margin-top:12px}
.hero p.sub{margin-top:14px; color:#CFC6B0; max-width:46ch; font-size:16.5px}
.hero .cta{display:flex; flex-wrap:wrap; gap:10px; margin-top:24px}
.hero .fine{margin-top:18px; font-size:12.5px; color:var(--muted); max-width:52ch}
.hero-shot{position:relative; display:grid; place-items:center; gap:14px; background:#FBFAF7; border:1px solid var(--line2); border-radius:20px; padding:22px 22px 18px; box-shadow:var(--glow)}
.hero-shot img{width:100%; max-width:440px; height:auto; aspect-ratio:1/1; object-fit:contain}
.hero-sw{display:flex; gap:7px; justify-content:center; margin-top:4px}
.hero-sw button{width:26px; height:26px; border-radius:50%; border:1.5px solid rgba(0,0,0,.15); background:var(--c); box-shadow:0 0 0 1px rgba(0,0,0,.12) inset; cursor:pointer; padding:0}
.hero-sw button[aria-pressed="true"]{border-color:var(--gold-dark); box-shadow:0 0 0 2px #FBFAF7 inset, 0 0 0 3px var(--gold)}
@media (max-width:880px){ .hero-in{grid-template-columns:minmax(0,1fr); gap:20px; padding-block:28px} .hero-shot{order:-1} .hero-shot img{max-width:320px} .hero-logo{margin-inline:auto} }

/* shop-by-brand tiles */
.btiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px}
.btiles button{min-height:84px; border-radius:14px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-weight:800; font-size:15px; transition:border-color .15s, box-shadow .15s}
.btiles button:hover{border-color:var(--gold-dark); box-shadow:var(--glow)}
.btiles button small{font-weight:600; font-size:12px; color:var(--muted)}

/* empty section state */
.esec{border:1px dashed var(--line2); border-radius:14px; padding:26px 22px; background:var(--bg2); max-width:62ch}
.esec b{display:block; font-size:15px; margin-bottom:6px; color:var(--gold)}
.esec p{font-size:13.5px; color:#C7BEA8; line-height:1.6}
.srule{font-size:12px; color:var(--muted); margin-top:-10px; margin-bottom:16px}

/* sections */
.sec{padding-block:46px}
.sec.alt{background:var(--bg2); border-block:1px solid var(--line)}
.sh{display:flex; align-items:flex-end; justify-content:space-between; gap:10px 24px; flex-wrap:wrap; margin-bottom:20px}
.sh h2{font-size:clamp(22px,2.8vw,30px); margin-top:4px}
.sh .more{font-weight:700; font-size:14px; text-decoration:none; color:var(--gold); border-bottom:2px solid var(--gold-dark); cursor:pointer}
.sh .more:hover{border-color:var(--gold)}
.ttl{font-size:clamp(24px,3vw,32px); margin-top:8px}
.crumbs{display:flex; flex-wrap:wrap; gap:6px; font-size:13px; color:var(--muted)}
.crumbs a{text-decoration:none; cursor:pointer}
.crumbs a:hover{color:var(--gold)}

/* search */
.sbox form{display:flex; background:var(--surface); border:1.5px solid var(--line2); border-radius:12px; overflow:hidden; max-width:620px}
.sbox form:focus-within{border-color:var(--gold)}
.sbox input{flex:1; min-width:0; border:0; padding:0 14px; min-height:52px; background:transparent; outline:none; font-size:16px; color:var(--ink)}
.sbox button{border:0; background:var(--gold-grad); color:var(--obsidian); padding:0 22px; font-weight:800; cursor:pointer}
.quick{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.quick button{min-height:36px; padding:0 14px; border-radius:99px; border:1px solid var(--line2); background:transparent; color:var(--muted); font-size:13.5px; font-weight:600; cursor:pointer}
.quick button:hover{border-color:var(--gold); color:var(--gold-light)}

/* product grid */
.grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px}
@media (max-width:1100px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:760px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px} }
.card{display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--gold-dark); box-shadow:var(--glow)}
.pimg{position:relative; aspect-ratio:1/1; background:linear-gradient(160deg,#1A1610,#0F0D0A); display:flex; flex-direction:column; justify-content:center; padding:16px; text-decoration:none; cursor:pointer}
.pimg .mk{font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.pimg .nm{font-size:clamp(16px,1.9vw,21px); font-weight:800; line-height:1.12; color:var(--gold-light); margin-top:4px}
.pimg .ph{position:absolute; left:16px; bottom:12px; right:16px; font-size:10.5px; color:var(--muted)}
/* product photography sits on a clean white tile */
.pimg.hasimg{background:#FFFFFF; padding:0; justify-content:flex-start}
.pimg.hasimg img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:6%}
.pimg.hasimg .mk,.pimg.hasimg .nm,.pimg.hasimg .ph{display:none}
.pimg .dots{position:absolute; left:12px; bottom:10px; display:flex; gap:5px; z-index:2}
.pimg .dots i{width:11px; height:11px; border-radius:50%; background:var(--c); box-shadow:0 0 0 1px rgba(0,0,0,.2) inset, 0 0 0 1.5px rgba(255,255,255,.85)}
.pimg .cct{position:absolute; right:12px; bottom:10px; z-index:2; font-size:10.5px; font-weight:700; color:#6B6355}

.galw{display:flex; flex-direction:column; gap:10px}
.gal.hasimg{padding:18px; background:#FFFFFF; position:relative}
.gal.hasimg img{width:100%; height:100%; object-fit:contain}
.thumbs{display:flex; gap:8px; flex-wrap:wrap}
.thumbs .th{width:62px; height:62px; padding:4px; border:1.5px solid var(--line2); border-radius:10px; background:#FFFFFF; cursor:pointer}
.thumbs .th img{width:100%; height:100%; object-fit:contain}
.thumbs .th[aria-current="true"]{border-color:var(--gold)}
.swatches{display:flex; gap:8px; flex-wrap:wrap; margin-top:2px}
.swb{display:inline-flex; align-items:center; gap:7px; padding:6px 12px 6px 8px; border:1.5px solid var(--line2); border-radius:999px; background:var(--surface); color:var(--ink); cursor:pointer; font-size:13px; font-weight:600}
.swb i{width:16px; height:16px; border-radius:50%; background:var(--c); box-shadow:0 0 0 1px rgba(255,255,255,.18) inset}
.swb[aria-pressed="true"]{border-color:var(--gold); font-weight:800; color:var(--gold-light)}
.galnote{font-size:11.5px; color:var(--muted); line-height:1.5}
.galnote.isrep{color:#E0A95A; font-weight:600}
.thumbs .th{position:relative}
.thumbs .th .thd{position:absolute; top:-5px; right:-5px; width:15px; height:15px; border-radius:50%; background:var(--red); color:#fff; font-size:10px; font-weight:800; line-height:15px; text-align:center}
.cb{padding:12px 14px 14px; display:flex; flex-direction:column; gap:5px; flex:1}
.cb .br{font-size:11.5px; font-weight:700; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
.cb h3{font-size:15.5px}
.cb h3 a{text-decoration:none; cursor:pointer}
.cb h3 a:hover{color:var(--gold)}
.cb .spec{font-size:12.5px; color:#B6AD97; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden}
.cb .pr{margin-top:auto; padding-top:8px}
.cb .pr strong{font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; display:block; color:var(--gold)}
.cb .pr small{font-size:11.5px; color:var(--muted)}
.cb .avail{font-size:12.5px; font-weight:700; color:#B6AD97}
.cact{display:grid; gap:8px; margin-top:8px}
@media (max-width:760px){ .cb{padding:10px 10px 12px} .cb .spec{display:none} }

/* filters */
.cat{display:grid; grid-template-columns:240px minmax(0,1fr); gap:24px; align-items:start; padding-block:14px 50px}
.side{position:sticky; top:calc(80px + env(safe-area-inset-top,0px)); max-height:calc(100dvh - 100px); overflow:auto; padding-right:4px}
.fg{border-bottom:1px solid var(--line); padding:12px 0}
.fg>summary{list-style:none; cursor:pointer; font-weight:800; font-size:14px; display:flex; justify-content:space-between}
.fg>summary::-webkit-details-marker{display:none}
.fg>summary::after{content:"+"; color:var(--gold)}
.fg[open]>summary::after{content:"–"}
.checks{display:grid; gap:6px; margin-top:10px}
.checks label{display:flex; align-items:center; gap:9px; font-size:14px; cursor:pointer; min-height:28px}
.checks input{width:16px; height:16px; accent-color:var(--gold); flex:none}
.checks .ct{margin-left:auto; font-size:12px; color:var(--muted)}
.minmax{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px}
.inp{width:100%; min-height:44px; border-radius:10px; border:1.5px solid var(--line2); background:var(--surface); color:var(--ink); padding:9px 12px}
.inp:focus{border-color:var(--gold); outline:none}
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; padding-bottom:12px; border-bottom:1px solid var(--line); margin-bottom:12px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; align-items:center}
.chip{display:inline-flex; align-items:center; gap:6px; min-height:32px; padding:0 10px 0 12px; border-radius:99px; background:var(--bg2); border:1px solid var(--line); font-size:13px; font-weight:600; cursor:pointer}
.chip:hover{border-color:var(--gold)}
.chip b{font-size:15px; color:var(--muted)}
.fbtn{display:none}
@media (max-width:960px){ .cat{grid-template-columns:minmax(0,1fr)} .side{display:none} .fbtn{display:inline-flex} }
.empty{grid-column:1/-1; border:1.5px dashed var(--line2); border-radius:14px; padding:36px 20px; text-align:center; display:grid; gap:10px; justify-items:center; color:var(--muted)}
.empty b{color:var(--gold); font-size:17px}
.pager{display:flex; justify-content:center; align-items:center; gap:12px; flex-wrap:wrap; margin-top:24px; font-size:14px; color:var(--muted)}

/* product page */
.pdp{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:34px; align-items:start; padding-block:14px 38px}
.gal{aspect-ratio:1/1; border:1px solid var(--line2); border-radius:18px; background:linear-gradient(160deg,#1A1610,#0F0D0A); display:grid; place-items:center; padding:30px; text-align:center}
.gal .mk{font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
.gal .nm{font-size:clamp(26px,4vw,42px); font-weight:800; margin-top:6px; color:var(--gold-light)}
.gal .ph{margin-top:22px; font-size:12.5px; color:var(--muted); max-width:34ch}
.buy{display:grid; gap:16px}
.buy h1{font-size:clamp(25px,3.2vw,36px)}
.price strong{font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--gold)}
.note{font-size:13px; color:var(--muted)}
.olabel{font-size:13.5px; font-weight:800; margin-bottom:8px}
.facts{display:grid; gap:8px; padding:14px; border-radius:12px; background:var(--bg2); font-size:14px; border:1px solid var(--line)}
.facts>div{display:flex; justify-content:space-between; gap:12px}
.facts>div>span:first-child{color:var(--muted)}
.facts b{text-align:right; min-width:0}
.bact{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:900px){ .pdp{grid-template-columns:minmax(0,1fr)} }
@media (max-width:560px){ .bact{grid-template-columns:1fr} }
.specs{display:grid; grid-template-columns:1fr 1fr; gap:0 36px; margin-top:16px}
.specs>div{padding:12px 0; border-bottom:1px solid var(--line)}
.specs dt{font-size:12.5px; color:var(--muted)}
.specs dd{margin:0; font-weight:600; margin-top:2px}
.nv{color:var(--muted); font-style:italic; font-weight:500}
@media (max-width:640px){ .specs{grid-template-columns:1fr} }

/* generic blocks */
.cards{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px}
@media (max-width:860px){ .cards{grid-template-columns:1fr 1fr} }
@media (max-width:560px){ .cards{grid-template-columns:1fr} }
.box{border:1px solid var(--line); border-radius:14px; padding:18px; background:var(--surface); display:flex; flex-direction:column; gap:8px}
.box h3{font-size:17px}
.box p{font-size:14px; color:#B6AD97}
.trust{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--surface)}
.trust>div{padding:18px; border-right:1px solid var(--line)}
.trust>div:last-child{border-right:0}
.trust b{display:block; font-size:15px}
.trust p{font-size:13.5px; color:var(--muted); margin-top:4px}
.trust svg{width:22px; height:22px; color:var(--gold); margin-bottom:8px}
@media (max-width:860px){ .trust{grid-template-columns:1fr 1fr} .trust>div:nth-child(2){border-right:0} .trust>div:nth-child(-n+2){border-bottom:1px solid var(--line)} }
@media (max-width:480px){ .trust{grid-template-columns:1fr} .trust>div{border-right:0; border-bottom:1px solid var(--line)} .trust>div:last-child{border-bottom:0} }

/* forms */
.form{display:grid; gap:14px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.three{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px}
@media (max-width:560px){ .two,.three{grid-template-columns:1fr} }
.field{display:grid; gap:6px; font-size:13.5px; font-weight:700}
.field input,.field select,.field textarea{width:100%; min-height:46px; border-radius:10px; border:1.5px solid var(--line2); background:var(--surface); color:var(--ink); padding:10px 12px; font-weight:400}
.field textarea{min-height:84px; resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold); outline:none}
.agree{display:flex; gap:10px; align-items:flex-start; font-size:13.5px}
.agree input{width:18px; height:18px; flex:none; margin-top:2px; accent-color:var(--gold)}
.err{color:var(--red); font-size:13px; font-weight:700}
.alert{border-radius:10px; padding:12px 14px; font-size:13.5px; background:var(--bg2); border:1px solid var(--line2)}
.alert.red{background:var(--red-soft); border-color:#5A2A2E}
.alert.ok{background:var(--ok-soft); border-color:#1E4A34}
.msg{white-space:pre-wrap; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:12px; max-height:230px; overflow:auto; color:var(--ink)}

/* cart */
.ci{display:grid; grid-template-columns:1fr auto; gap:14px; padding:14px 0; border-bottom:1px solid var(--line)}
.qty{display:flex; align-items:center; gap:6px; margin-top:8px}
.qty button{width:30px; height:30px; border-radius:8px; border:1px solid var(--line2); background:var(--surface); color:var(--ink); cursor:pointer}
.qty span{min-width:24px; text-align:center; font-variant-numeric:tabular-nums}
.rowline{display:flex; justify-content:space-between; gap:12px; font-size:14.5px}
.rowline.total{font-weight:800; font-size:16px; padding-top:10px; border-top:1px solid var(--line); color:var(--gold)}
.sumbox{border:1px solid var(--line); border-radius:14px; padding:20px; display:grid; gap:12px; background:var(--surface)}
.layout2{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:28px; align-items:start}
@media (max-width:900px){ .layout2{grid-template-columns:minmax(0,1fr)} }

/* faq + doc */
.faq{display:grid; gap:8px; max-width:860px}
.faq details{border:1px solid var(--line); border-radius:12px; padding:0 16px; background:var(--surface)}
.faq summary{cursor:pointer; padding:14px 0; font-weight:700; list-style:none; display:flex; justify-content:space-between; gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+"; color:var(--gold); font-size:18px}
.faq details[open] summary::after{content:"–"}
.faq details p{padding-bottom:14px; color:#B6AD97}
.doc{max-width:760px; padding-block:26px 50px}
.doc h1{font-size:clamp(26px,3.4vw,36px); margin:8px 0 12px}
.doc h2{font-size:18px; margin:24px 0 6px; color:var(--gold-light)}
.doc p,.doc li{color:#C2B9A3}
.doc ul{padding-left:20px}

/* footer */
.foot{background:#060504; color:var(--muted); padding-block:42px calc(26px + env(safe-area-inset-bottom,0px)); border-top:2px solid var(--gold-dark); margin-top:20px}
.foot-in{display:grid; grid-template-columns:1.3fr repeat(3,1fr); gap:28px}
.foot-in img{box-shadow:0 0 0 1px var(--line2); border-radius:12px}
.foot h4{color:var(--gold); font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:12px}
.foot ul{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.foot a{color:#C2B9A3; text-decoration:none; font-size:14.5px; cursor:pointer}
.foot a:hover{color:var(--gold)}
.foot-base{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:30px; padding-top:16px; border-top:1px solid #241F18; font-size:12.5px}
@media (max-width:820px){ .foot-in{grid-template-columns:1fr 1fr} .foot-in>div:first-child{grid-column:1/-1} }

/* dialogs */
dialog{border:0; padding:0; background:var(--bg2); color:var(--ink); max-width:none; max-height:none}
dialog::backdrop{background:rgba(0,0,0,.72)}
dialog.drawer{margin:0 auto 0 0; width:min(400px,100vw); height:100dvh; display:none; flex-direction:column}
dialog.drawer[open]{display:flex}
dialog.modal{border-radius:16px; width:min(620px,calc(100vw - 24px)); max-height:calc(100dvh - 24px); overflow:auto; border:1px solid var(--line2)}
.dh{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg2); z-index:2}
dialog.modal .dh{padding-top:14px}
.dh h2{font-size:18px}
.db{flex:1; overflow:auto; padding:16px 18px}
.x{width:38px; height:38px; border-radius:10px; border:1px solid var(--line2); background:var(--surface); color:var(--ink); font-size:20px; cursor:pointer; flex:none}
.mnav{display:grid}
.mnav a{padding:14px 4px; border-bottom:1px solid var(--line); text-decoration:none; font-weight:700; font-size:16px; cursor:pointer}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,160%); visibility:hidden; z-index:100; display:flex; align-items:center; gap:12px; padding:10px 10px 10px 16px; border-radius:12px; background:var(--charcoal); color:var(--ink); border:1px solid var(--line2); box-shadow:0 18px 40px -14px rgba(0,0,0,.7); transition:transform .25s ease; max-width:calc(100vw - 32px); font-size:14px}
.toast.show{transform:translate(-50%,0); visibility:visible}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} html{scroll-behavior:auto} }

/* Exact supplied ALFATECH wordmark */
.wordmark{width:clamp(150px,22vw,218px);height:auto;margin-right:12px}
.wordmark-img{display:block;width:100%;height:auto;object-fit:contain}
@media(max-width:560px){.wordmark{width:clamp(138px,39vw,178px);margin-right:4px}}
/* Branded opening animation */
#alfatech-intro{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#000;opacity:1;visibility:visible;transition:opacity .65s ease,visibility .65s ease}
#alfatech-intro img{width:min(88vw,900px);height:auto;display:block;animation:alfatech-reveal 1.15s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 0 24px rgba(212,175,82,.12))}
#alfatech-intro.hide{opacity:0;visibility:hidden;pointer-events:none}
@keyframes alfatech-reveal{from{opacity:0;transform:scale(.94);filter:blur(7px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
@media(prefers-reduced-motion:reduce){#alfatech-intro img{animation:none}#alfatech-intro{transition:none}}

async function loadCatalog(){
  try {
    const c = new AbortController(); const t = setTimeout(() => c.abort(), 2500);
    const r = await fetch('/api/catalog', { signal: c.signal, cache: 'no-store' });
    clearTimeout(t);
    if (r.ok){ const j = await r.json(); if (j && Array.isArray(j.models) && j.models.length) return j; }
  } catch (e) {}
  return DEFAULT_CATALOG;
}

  const lo = F.budget != null ? BUDGETS[F.budget][1] : (F.min ? +F.min : null);
  const hi = F.budget != null ? BUDGETS[F.budget][2] : (F.max ? +F.max : null);
  const L = PRODUCTS.filter(p =>
    (!F.brand.length || F.brand.includes(p.brand)) &&
    (lo == null || p.price >= lo) && (hi == null || p.price <= hi) &&
    matchQ(p, F.q));
  const S = {
    price_desc:(a,b)=>b.price-a.price, price_asc:(a,b)=>a.price-b.price,
    name:(a,b)=>a.name.localeCompare(b.name),
    brand:(a,b)=>a.brand.localeCompare(b.brand) || b.price-a.price
  };
  return groupModels(L).sort(S[F.sort]);
}

  <p class="alert" style="margin-top:12px">Accounts work on the live website, where sign-up, login, saved addresses, order history and invoice downloads all run against the shop's database. This preview has no database, so there is nothing to sign in to.</p>
  <p style="margin-top:16px">On the live site you can create an account to keep your delivery addresses and see every order you have placed, or check out as a guest and track the order with its order number instead.</p>
  <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:18px">
    <a class="btn btn-dark" href="#track">Track an order</a>
    <button class="btn btn-wa" type="button" data-askgeneral>Message the shop</button>
  </div></div>`;

V.about = () => `<div class="wrap doc">
  <nav class="crumbs"><a href="#home">Home</a><span>/</span><span>About</span></nav>
  <h1>About ALFATECH MOBILES</h1>
  <p>ALFATECH MOBILES is a smartphone shop on Nishat Road, Sadar Bazar, Shahjahanpur, Uttar Pradesh. We sell new smartphones from Apple, vivo, Redmi and Motorola, and deliver across Uttar Pradesh.</p>
  <p style="margin-top:14px">Every phone on this website is listed with the specification and price reference we hold for it, and a link to the manufacturer's own product page. Where we have not verified something, the website says so rather than guessing.</p>
  <p class="alert" style="margin-top:20px"><b>Still to be published:</b> shop opening hours, GSTIN and legal entity details. These will appear here once ALFATECH MOBILES confirms them.</p></div>`;

V.contact = () => `<div class="wrap doc">
  <nav class="crumbs"><a href="#home">Home</a><span>/</span><span>Contact</span></nav>
  <h1>Contact us</h1>
  <p>Questions about a model, a variant, availability or an order — talk to the shop directly.</p>
  <div class="facts" style="margin-top:20px">
    <div><span>Shop address</span><b>${esc(SHOP.addr1)}, ${esc(SHOP.city)}, ${esc(SHOP.state)} ${esc(SHOP.pin)}</b></div>
    <div><span>Phone / WhatsApp</span><b>${esc(SHOP.phone)}</b></div>
    <div><span>Email</span><b>${esc(SHOP.email)}</b></div>
    <div><span>Delivery area</span><b>${esc(SHOP.deliveryState)} only</b></div>
  </div>
  <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:22px">
    <button class="btn btn-wa" type="button" data-askgeneral>Message us on WhatsApp</button>
    <a class="btn btn-line" href="mailto:${esc(SHOP.email)}">Email the shop</a>
  </div>
  <p class="note" style="margin-top:18px">Shop opening hours are not published here yet. Please call before visiting.</p></div>`;

const FAQ = [
  ['Where do you deliver?', `We deliver inside ${SHOP.deliveryState} only. Your PIN code is checked at checkout, and orders outside the delivery area cannot be placed.`],
  ['Is the price on the website the final price?', 'The price shown is the ALFATECH MOBILES selling price. Offers can change it, so the shop confirms the final price before dispatch.'],
  ['How do I pay?', 'No online payment gateway is connected yet. Orders are confirmed with the shop on WhatsApp, and you pay by the method the shop offers. Card numbers, CVV and UPI PIN are never entered on this website.'],
  ['Do I get a GST invoice?', 'ALFATECH MOBILES is GST registered. Until the GST details are added to the website, orders are issued with a pro forma order summary that is clearly labelled as not being a GST tax invoice.'],
  ['Are the phones new?', 'Yes. ALFATECH MOBILES sells new smartphones only. There is no refurbished or second-hand stock.'],
  ['Do you offer EMI?', 'Yes. Every phone page shows approximate monthly EMI for each plan. Tap "EMI ke liye WhatsApp karein" and the shop will confirm the exact plan, down payment and documents.'],
  ['Are the photos real?', 'Product photos are official brand images for each model and colour. Colour availability is confirmed by the shop before dispatch.'],
  ['What warranty do I get?', 'Phones carry the manufacturer’s warranty and are serviced at the brand’s authorised service centres. Exact terms are confirmed by the shop.']
];
V.faq = () => `<div class="wrap doc" style="max-width:880px">
  <nav class="crumbs"><a href="#home">Home</a><span>/</span><span>FAQ</span></nav>
  <h1>Frequently asked questions</h1>
  <div class="faq" style="margin-top:18px">${FAQ.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</div></div>`;

const seller = `${SHOP.name}, ${SHOP.addr1}, ${SHOP.city}, ${SHOP.state} ${SHOP.pin}`;
const DOCS = {
  shipping: ['Shipping and delivery policy', `
    <h2>Where we deliver</h2><p>${seller} delivers to serviceable PIN codes inside ${SHOP.deliveryState} only. Your PIN code is validated before an order is accepted; orders outside the delivery area cannot be placed.</p>
    <h2>Delivery charges and timelines</h2><p>Any delivery charge is shown in your order summary before you confirm. Timelines depend on stock and your location and are confirmed when the shop confirms your order. We do not publish a guaranteed delivery date.</p>
    <h2>When your order arrives</h2><p>Please check that the box seal is intact and that the IMEI on the box matches your order document before accepting the parcel.</p>`],
  returns: ['Cancellation, return and refund policy', `
    <h2>Cancellation</h2><p>You may cancel an order at any time before it is dispatched. Contact the shop with your order number. If you have already paid, the amount is refunded in full.</p>
    <h2>Returns</h2><p>Sealed-box smartphones that have been opened cannot be returned unless the device is defective. If a phone is dead on arrival or has a manufacturing defect, report it to the shop as soon as possible after delivery. Replacement follows the manufacturer's policy and may require a report from the brand's authorised service centre.</p>
    <h2>Refunds</h2><p>Approved refunds are returned to the original payment method. The shop confirms the timeline when the refund is approved.</p>
    <h2>Not covered</h2><p>Physical damage, liquid damage, and accessories once opened or fitted.</p>`],
  privacy: ['Privacy policy', `
    <h2>What we collect</h2><p>Your name, mobile number, WhatsApp number if given, email address, delivery address and order details.</p>
    <h2>Why we collect it</h2><p>To process and deliver your order, send order updates, issue your order document and support warranty claims. We keep order records for as long as required for accounting and tax purposes.</p>
    <h2>Payment information</h2><p>We do not collect or store card numbers, CVV codes, UPI PINs or net banking passwords on this website.</p>
    <h2>WhatsApp messages</h2><p>We send order documents and updates to WhatsApp only if you ask us to at checkout. These are messages about your own order. You can ask us to stop at any time.</p>
    <h2>Who we share it with</h2><p>Only the service providers needed to complete your order. We do not sell your data.</p>
    <h2>Your choices</h2><p>Contact the shop to correct or delete your details, subject to records we are required to keep.</p>`],
  terms: ['Terms and conditions', `
    <h2>Who you are buying from</h2><p>${seller}.</p>
    <h2>Products and prices</h2><p>All phones sold are new. Prices are in Indian rupees. Specifications and reference prices come from manufacturer product pages, linked on each product page; anything we have not verified is marked as such. Prices and availability can change, and the shop confirms the final price before dispatch.</p>
    <h2>Orders</h2><p>An order is an offer to buy. It is accepted when the shop confirms it. We may decline an order if an item is out of stock, if a price was listed in error, or if the delivery address cannot be served. Any amount already paid is refunded in full.</p>
    <h2>Payment</h2><p>Online card and UPI gateway payment is not available until a payment provider has been selected, configured and tested. Until then orders are confirmed directly with the shop.</p>
    <h2>Invoices and tax</h2><p>ALFATECH MOBILES is GST registered. Until the GST configuration is completed on the website, orders are issued with a pro forma order summary rather than a GST tax invoice. The document is clearly labelled.</p>
    <h2>Warranty</h2><p>Phones carry the manufacturer's warranty and are serviced at the brand's authorised service centres. The shop will help with a claim, but repair and replacement decisions are made by the manufacturer.</p>
    <h2>Governing law</h2><p>These terms are governed by the laws of India, and disputes are subject to the jurisdiction of the courts at Shahjahanpur, Uttar Pradesh.</p>`]
};
['shipping','returns','privacy','terms'].forEach(k => {
  V[k] = () => `<div class="wrap doc"><p class="kicker">Policy</p><h1>${DOCS[k][0]}</h1>
    <p class="alert">Draft for review. ALFATECH MOBILES must confirm every point before the site goes live.</p>
    <div style="margin-top:6px">${DOCS[k][1]}</div></div>`;
});

/* ===================== router ===================== */
const NAVS = [['home','Home'],['shop','Shop'],['brands','Brands'],['search','Search'],['account','Account'],['cart','Cart'],['track','Track order'],['about','About'],['contact','Contact'],['faq','FAQ']];
/* brand navigation row: All + every brand in the catalogue */
$('#brandnav').innerHTML = ['All', ...BRANDS].map(b =>
  `<a href="#shop" data-bnav="${b === 'All' ? '' : esc(b)}">${esc(b)}</a>`).join('');
function markBrandNav(){
  const on = location.hash === '#shop' && F.brand.length === 1 ? F.brand[0] : (location.hash === '#shop' && !F.brand.length ? 'All' : null);
  document.querySelectorAll('[data-bnav]').forEach(a => {
    const v = a.dataset.bnav || 'All';
    a.setAttribute('aria-current', String(v === on));
  });
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-bnav]'); if (!a) return;
  e.preventDefault();
  const b = a.dataset.bnav;
  F = blank();
  if (b){ F.brand = [b]; F.title = b + ' smartphones'; } else { F.title = 'All smartphones'; }
  go('shop');
});
$('#mnav').innerHTML = NAVS.map(([r,t]) => `<a href="#${r}" data-r="${r}" data-close>${t}</a>`).join('');
$('#menuBtn').addEventListener('click', () => $('#menu').showModal());

function route(){
  const h = location.hash.slice(1) || 'home';
  if (h.startsWith('p-')) return ['product', h.slice(2)];
  return [V[h] ? h : 'home'];
}
function render(keep){
  const [r, arg] = route(), y = scrollY;
  $('#view').innerHTML = r === 'product' ? V.product(arg) : V[r]();
  scrollTo(0, keep ? y : 0);
  document.querySelectorAll('[data-r]').forEach(a => a.dataset.r === r ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  const p = r === 'product' ? byId(arg) : null;
  document.title = p ? `${p.name} · ALFATECH Mobiles` : 'ALFATECH Mobiles';
  markBrandNav();
}
addEventListener('hashchange', () => render());

function go(r){ if (location.hash === '#' + r) render(); else location.hash = r; }
window.doSearch = function(e){
  e.preventDefault();
  const v = (e.target.querySelector('input')?.value ?? '').trim();
  F = blank(); F.q = v; F.title = v ? `Results for “${v}”` : 'All smartphones';
  go('shop'); return false;
};

/* ---- global actions ---- */
document.addEventListener('click', e => {
  let t;
  if ((t = e.target.closest('[data-close]'))){ const d = t.closest('dialog'); if (d) d.close(); }
  if ((t = e.target.closest('[data-add]'))){ addCart(t.dataset.add); return; }
  if ((t = e.target.closest('[data-buy]'))){ addCart(t.dataset.buy, true); go('checkout'); return; }
  if ((t = e.target.closest('[data-ask]'))){ const p = byId(t.dataset.ask);
    openWA(`Hello ALFATECH MOBILES, mujhe ${p.mname}${p.vlabel ? ' (' + p.vlabel + ')' : ''} ke baare mein jaankari chahiye. Website price: ${inr(p.price)}. Kaun se colours stock mein hain?`, 'Ask about this phone'); return; }
  if ((t = e.target.closest('[data-emi]'))){ const p = byId(t.dataset.emi); if (p) openWA(emiMsg(p), 'EMI plans on WhatsApp'); return; }
  if (e.target.closest('[data-askgeneral]')){ openWA('Hello ALFATECH MOBILES, I have a question.', 'Message the shop'); return; }
  if ((t = e.target.closest('[data-brand]'))){ e.preventDefault(); F = blank(); F.brand = [t.dataset.brand]; F.title = t.dataset.brand + ' smartphones'; go('shop'); return; }
  if ((t = e.target.closest('[data-budget]'))){ e.preventDefault(); F = blank(); F.budget = +t.dataset.budget; F.title = 'Smartphones ' + BUDGETS[F.budget][0].toLowerCase(); go('shop'); return; }
});

/* ---- featured-phone colour swap on the homepage ---- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-hero]'); if (!t) return;
  const f = byId(FEATURED_ID), c = gal(FEATURED_ID)[+t.dataset.hero], img = $('#heroImg');
  img.src = c.shots[0].u;
  img.alt = `${f.name} in ${c.name}`;
  t.parentElement.querySelectorAll('[data-hero]').forEach(b => b.setAttribute('aria-pressed', String(b === t)));
});

/* ---- gallery ---- */
document.addEventListener('click', e => {
  const w = e.target.closest('.galw'); if (!w) return;
  const main = w.querySelector('#galMain');
  const p = byId(w.dataset.pid), note = w.querySelector('#galNote');
  const setNote = s => { note.textContent = noteFor(p, s); note.classList.toggle('isrep', !!s.d); };
  let t;
  if ((t = e.target.closest('[data-shot]'))){
    main.src = t.dataset.shot;
    w.querySelectorAll('[data-shot]').forEach(b => b.setAttribute('aria-current', String(b === t)));
    setNote({ u: t.dataset.shot, d: t.dataset.from || null });
    return;
  }
  if ((t = e.target.closest('[data-colour]'))){
    const i = +t.dataset.colour, c = gal(p.id)[i];
    main.src = c.shots[0].u;
    main.alt = `${p.name} in ${c.name}`;
    w.querySelector('#galThumbs').innerHTML = shotsHTML(p, i);
    w.querySelectorAll('[data-colour]').forEach(b => b.setAttribute('aria-pressed', String(b === t)));
    setNote(c.shots[0]);
  }
});

/* ---- cart actions ---- */
document.addEventListener('click', e => {
  if (location.hash !== '#cart') return;
  let t;
  if ((t = e.target.closest('[data-inc]'))) cart[+t.dataset.inc].qty = Math.min(5, cart[+t.dataset.inc].qty + 1);
  else if ((t = e.target.closest('[data-dec]'))){ const k = +t.dataset.dec; if (--cart[k].qty < 1) cart.splice(k,1); }
  else if ((t = e.target.closest('[data-rm]'))) cart.splice(+t.dataset.rm, 1);
  else return;
  store.set('cart', cart); counts(); render(true);
});
$('#cartBtn').addEventListener('click', () => go('cart'));

/* ---- shop filters ---- */
document.addEventListener('change', e => {
  if (location.hash !== '#shop') return;
  const t = e.target.closest('[data-fk]');
  if (t){
    const k = t.dataset.fk, v = t.value;
    if (k === 'brand') F.brand = t.checked ? [...F.brand, v] : F.brand.filter(x => x !== v);
    if (k === 'budget'){ F.budget = v === '' ? null : +v; F.min = ''; F.max = ''; }
    if (k === 'min' || k === 'max'){ F[k] = v; F.budget = null; }
    F.page = 1; refresh();
  }
  if (e.target.id === 'sortSel'){ F.sort = e.target.value; F.page = 1; refresh(); }
});
document.addEventListener('click', e => {
  if (location.hash !== '#shop') return;
  const u = e.target.closest('[data-unf]');
  if (u){ const k = u.dataset.unf, v = u.dataset.v;
    if (k === 'q'){ F.q = ''; F.title = 'All smartphones'; }
    else if (k === 'brand') F.brand = F.brand.filter(x => x !== v);
    else if (k === 'budget') F.budget = null; else F[k] = '';
    F.page = 1; refresh(); }
  if (e.target.closest('#clearAll') || e.target.closest('#clearAll2')){ F = blank(); refresh(); }
  if (e.target.closest('#moreBtn')){ F.page++; refresh(); }
  if (e.target.closest('#openF')){ $('#filtersBody').innerHTML = sideHTML(); $('#filters').showModal(); }
});
function refresh(){ const y = scrollY; $('#view').innerHTML = V.shop(); if ($('#filters').open) $('#filtersBody').innerHTML = sideHTML(); scrollTo(0, y); }
$('#filters').addEventListener('close', () => { if (location.hash === '#shop') refresh(); });
$('#filters').addEventListener('change', e => { if (e.target.closest('[data-fk]') && location.hash === '#shop'){ /* handled above */ } });

/* ---- checkout ---- */
document.addEventListener('submit', e => {
  if (e.target.id !== 'coForm') return;
  e.preventDefault();
  const fd = new FormData(e.target);
  const get = k => String(fd.get(k) ?? '').trim();
  const errs = [];
  if (get('name').length < 2) errs.push('Enter your full name.');
  if (!normPhone(get('phone'))) errs.push('Enter a valid 10-digit mobile number.');
  if (get('whatsapp') && !normPhone(get('whatsapp'))) errs.push('Enter a valid WhatsApp number, or leave it blank.');
  if (get('line1').length < 5) errs.push('Enter your full address.');
  if (get('city').length < 2) errs.push('Enter your city.');
  if (!/^[1-9][0-9]{5}$/.test(get('pincode'))) errs.push('Enter a valid 6-digit PIN code.');
  else if (!isUpPin(get('pincode'))) errs.push(`We deliver inside ${SHOP.deliveryState} only, and ${get('pincode')} is outside our delivery area.`);
  if (!fd.get('confirm')) errs.push('Please confirm your contact details.');
  if (!fd.get('policies')) errs.push('Please accept the store policies.');

  if (errs.length){ $('#coErr').textContent = errs[0]; $('#coErr').scrollIntoView({ block:'center' }); return; }

  const items = cart.map((i,k) => { const p = byId(i.id); return `${k+1}. ${p.name}${i.qty>1?` × ${i.qty}`:''} — ${inr(p.price * i.qty)}`; }).join('\n');
  const msg = `Hello ALFATECH MOBILES, I would like to place an order.\n\n${items}\nTotal (reference): ${inr(cartTotal())}\n\nName: ${get('name')}\nMobile: ${normPhone(get('phone'))}` +
    (get('whatsapp') ? `\nWhatsApp: ${normPhone(get('whatsapp'))}` : '') +
    (get('email') ? `\nEmail: ${get('email')}` : '') +
    `\nAddress: ${get('line1')}${get('line2') ? ', ' + get('line2') : ''}, ${get('city')}${get('district') ? ', ' + get('district') : ''}, Uttar Pradesh – ${get('pincode')}` +
    (get('notes') ? `\nNotes: ${get('notes')}` : '') +
    (fd.get('consent') ? `\n\nPlease send my order document to this WhatsApp number.` : '');

  openWA(msg, 'Send your order');
});

/* ---- toast ---- */
let tt;
function toast(m){ $('#toastMsg').textContent = m; const t = $('#toast'); t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }
$('#toastBtn').addEventListener('click', () => { $('#toast').classList.remove('show'); go('cart'); });

document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => {
  if (e.target === d){ const r = d.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) d.close(); }
}));

// Always open the storefront front page on a fresh page load.
if (location.hash !== '#ALFATECH' && location.hash !== '#home') history.replaceState(null, '', location.pathname + location.search + '#home');
counts(); render();
})();
</script>
<script>
(function(){
  var intro = document.getElementById('alfatech-intro');
  if (!intro) return;
  function hideIntro(){
    if (intro.classList.contains('hide')) return;
    intro.classList.add('hide');
    setTimeout(function(){ if (intro.parentNode) intro.parentNode.removeChild(intro); }, 800);
  }
  setTimeout(hideIntro, 1600);           // logo dikhakar ~1.6s mein hata do
  intro.addEventListener('click', hideIntro); // tap karke bhi skip ho sake
})();
</script>

</body>
</html>
